[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-mcp"
version = "0.2.0b11"
description = "Hermes Mem is an independent community fork of Hermes Agent focused on isolated local memory and a simplified desktop experience"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FPP Labs" }]
dependencies = [
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ai-memory-mcp = "ai_memory_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/FPP-Labs/hermes_mem"
Source = "https://github.com/FPP-Labs/hermes_mem"
"Hermes Agent by Nous Research" = "https://github.com/NousResearch/hermes-agent"

[tool.setuptools.packages.find]
where = ["src"]
