[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-mcp"
version = "0.1.0"
description = "Local SQLite memory MCP server for Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-memory-mcp maintainers" }]
dependencies = [
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ai-memory-mcp = "ai_memory_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
